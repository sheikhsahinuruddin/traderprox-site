<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b;color:#eaf4ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#space{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 8% 18%,#fff 99%,transparent),radial-gradient(1px 1px at 72% 12%,#c7d9ff 99%,transparent),radial-gradient(1.5px 1.5px at 89% 39%,#fff 99%,transparent),radial-gradient(1px 1px at 24% 62%,#fff 99%,transparent),radial-gradient(1px 1px at 57% 79%,#c9d9ff 99%,transparent),radial-gradient(1px 1px at 38% 31%,#fff 99%,transparent),radial-gradient(1px 1px at 94% 83%,#fff 99%,transparent),radial-gradient(1px 1px at 12% 87%,#c7d9ff 99%,transparent);background-size:100% 100%;opacity:.85}.search{position:fixed;z-index:5;top:max(16px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 28px));display:flex;gap:8px;padding:7px;border:1px solid #8db9ff44;border-radius:17px;background:#050c1bd9;box-shadow:0 8px 35px #0008;backdrop-filter:blur(16px)}input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:10px;font-size:15px}input::placeholder{color:#9aaac3}button{cursor:pointer;color:#eaf4ff;background:#0c1a30;border:1px solid #8db9ff35;border-radius:12px;padding:10px 14px;font:inherit}.search button{background:#c9efff;color:#071323;font-weight:750}.results{display:none;position:fixed;z-index:6;top:calc(max(16px,env(safe-area-inset-top)) + 62px);left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 28px));max-height:38vh;overflow:auto;border:1px solid #8db9ff44;border-radius:14px;background:#050c1bf5;backdrop-filter:blur(16px)}.result{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #ffffff14;border-radius:0;background:transparent}.result small{display:block;color:#9baec9;margin-top:3px}.controls{position:fixed;z-index:4;right:14px;top </style></head><body><canvas id="space"></canvas><div class="stars"></div><div class="brand">◉ ORBITAL / EARTH</div><form class="search" id="form"><input id="query" type="search" autocomplete="off" placeholder="Search any country, city or place…" aria-label="Search any country, city or place"><button type="submit">⌕</button></form><div id="results" class="results"></div><div class="controls"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="reset" aria-label="Reset Earth">↺</button></div><div class="place"><b id="selected">Earth</b><span id="coords">Live day & night · city lights</span></div><div class="hint">DRAG TO ROTATE · PINCH TO ZOOM</div>

const canvas=document.querySelector('#space'),scene=new THREE.Scene();scene.background=new THREE.Color('#02040b');

const earthMat=new THREE.ShaderMaterial({uniforms:{dayMap:{value:day},nightMap:{value:night},sunDir:{value:new THREE.Vector3(1,0,0)}},vertexShader:'varying vec2 vUv; varying vec3 vNormalW; void main(){vUv=uv;vNormalW=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'uniform sampler2D dayMap;uniform sampler2D nightMap;uniform vec3 sunDir;varying vec2 vUv;varying vec3 vNormalW;void main(){float n=dot(normalize(vNormalW),normalize(sunDir));float day=smoothstep(-.12,.16,n);vec3 a=texture2D(dayMap,vUv).rgb*(.22+.98*max(n,0.));vec3 b=texture2D(nightMap,vUv).rgb*vec3(1.,.69,.35)*1.75+vec3(.002,.005,.015);gl_FragColor=vec4(mix(b,a,day),1.);}'});const globe=new THREE.Group();scene.add(globe);const earth=new THREE.Mesh(new THREE.SphereGeometry(1,112,112),earthMat);globe.add(earth);

function xyz(lat,lon,r=1.012){let a=THREE.MathUtils.degToRad(90-lat),b=THREE.MathUtils.degToRad(lon+180);return new THREE.Vector3(-r*Math.sin(a)*Math.cos(b),r*Math.cos(a),r*Math.sin(a)*Math.sin(b))}
const labelItems=[];for(const [name,lat,lon,type] of places){let el=document.createElement('div');el.className='tag '+type;el.textContent=name;let obj=new CSS2DObject(el);obj.position.copy(xyz(lat,lon,1.012));globe.add(obj);labelItems.push({name,lat,lon,type,el,obj})}
let zoom=2.75,drag=false,lastX=0,lastY=0,pointers=new Map(),pinch=0,selectedLabel=null;
function resize(){renderer.setSize(innerWidth,innerHeight);labels.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}addEventListener('resize',resize);
const solar=d=>{let jd=d.getTime()/86400000+2440587.5,n=jd-2451545,L=(280.46+.9856474*n)%360,g=(357.528+.9856003*n)*Math.PI/180,lam=(L+1.915*Math.sin(g)+.02*Math.sin(2*g))*Math.PI/180,eps=(23.439-.0000004*n)*Math.PI/180,ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)),dec=Math.asin(Math.sin(eps)*Math.sin(lam)),gmst=((280.46061837+360.98564736629*(jd-2451545))%360+360)%360*Math.PI/180;return{lat:dec*180/Math.PI,lon:((ra-gmst)*180/Math.PI+540)%360-180}};
function setZoom(z){zoom=THREE.MathUtils.clamp(z,1.25,7);camera.position.z=zoom}

canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){drag=true;lastX=e.clientX;lastY=e.clientY}else if(pointers.size===2){const p=[...pointers.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);drag=false}canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)setZoom(zoom+(pinch-d)*.009);pinch=d}else if(drag){globe.rotation.y+=(e.clientX-lastX)*.005;globe.rotation.x=THREE.MathUtils.clamp(globe.rotation.x+(e.clientY-lastY)*.004,-1.45,1.45);lastX=e.clientX;lastY=e.clientY}});
function end(e){pointers.delete(e.pointerId);if(!pointers.size)drag=false;pinch=0}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom+e.deltaY*.003)},{passive:false});
const input=document.querySelector('#query'),results=document.querySelector('#results');async function search(q){if(!q.trim())return;results.style.display='block';results.innerHTML='<button class="result">Searching worldwide…</button>';try{const res=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&q='+encodeURIComponent(q),{headers:{'Accept-Language':'en'}}),data=await res.json();results.innerHTML='';if(!data.length){results.textContent='No places found. Try another name.';return}for(const p of data){const b=document.createElement('button');b.className='result';b.innerHTML='';const strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=p.name||p.display_name.split(',')[0];small.textContent=p.display_name;b.append(strong,small);b.onclick=()=>{const lat=+p.lat,lon=+p.lon;globe.rotation.set(THREE.MathUtils.degToRad(lat),THREE.MathUtils.degToRad(-lon),0);setZoom(p.type==='country'?2.15:1.55);document.querySelector('#selected').textContent=p.name||p.display_name.split(',')[0];document.querySelector('#coords').textContent=p.display_name;selectedLabel=p.name||p.display_name.split(',')[0];results.style.display='none';input.value=selectedLabel};results.append(b)}}catch{results.textContent='Place search needs an internet connection.'}}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();search(input.value)};let debounce;input.oninput=()=>{clearTimeout(debounce);if(input.value.trim().length>2)debounce=setTimeout(()=>search(input.value),500);else results.style.display='none'};document.addEventListener('click',e=>{if(!e.target.closest('.search')&&!e.target.closest('.results'))results.style.display='none'});
function animate(){requestAnimationFrame(animate);const s=solar(new Date());earthMat.uniforms.sunDir.value.set(Math.cos(THREE.MathUtils.degToRad(s.lat))*Math.sin(THREE.MathUtils.degToRad(s.lon)),Math.sin(THREE.MathUtils.degToRad(s.lat)),Math.cos(THREE.MathUtils.degToRad(s.lat))*Math.cos(THREE.MathUtils.degToRad(s.lon))).applyAxisAngle(new THREE.Vector3(0,1,0),globe.rotation.y);labelItems.forEach(p=>{const world=p.obj.getWorldPosition(new THREE.Vector3()),front=world.clone().normalize().dot(camera.position.clone().sub(globe.position).normalize())>.15;p.el.classList.toggle('hidden',!front||(p.type==='city'&&zoom>3.5)||(p.type==='country'&&zoom<1.45));if(selectedLabel===p.name)p.el.classList.add('selected');else p.el.classList.remove('selected')});renderer.render(scene,camera);labels.render(scene,camera)}animate();
