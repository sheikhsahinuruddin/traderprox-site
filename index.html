            {/* VIEW: OFFICIAL RESOURCES DIRECTORY */}
            {activeTab === 'resources' && (
              <div className="max-w-6xl mx-auto px-4 sm:px-6 py-10 space-y-8">
                <div className="text-center max-w-2xl mx-auto">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-300 text-xs font-semibold mb-2">
                    <IconShieldCheck className="w-3.5 h-3.5" />
                    <span>Verified Meta Destinations Only</span>
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white">Official Help & Recovery Directory</h2>
                  <p className="text-zinc-400 text-sm mt-1">
                    Direct access to genuine Instagram and Meta support pages. No third-party intermediaries.
                  </p>
                </div>

                <div className="relative">
                  <IconSearch className="w-4 h-4 text-zinc-500 absolute left-3.5 top-3" />
                  <input
                    type="text"
                    value={resourceSearch}
                    onChange={(e) => setResourceSearch(e.target.value)}
                    placeholder="Search official links (e.g. hacked, deactivated, business, 2FA)..."
                    className="w-full pl-9 pr-4 py-2.5 text-xs bg-zinc-900 border border-white/10 rounded-xl text-white placeholder-zinc-500 focus:outline-none focus:border-emerald-500"
                  />
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {OFFICIAL_LINKS_DATA.filter(link => 
                    link.title.toLowerCase().includes(resourceSearch.toLowerCase()) ||
                    link.desc.toLowerCase().includes(resourceSearch.toLowerCase()) ||
                    link.tags.some(t => t.toLowerCase().includes(resourceSearch.toLowerCase()))
                  ).map(link => (
                    <div
                      key={link.id}
                      className="p-5 rounded-2xl bg-zinc-900/60 border border-white/10 hover:border-emerald-500/30 flex flex-col justify-between transition-all"
                    >
                      <div>
                        <div className="flex items-center justify-between gap-2 mb-2">
                          <span className="text-[10px] font-semibold px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">
                            {link.category}
                          </span>
                          <span className="text-[10px] text-emerald-400 font-medium flex items-center gap-1">
                            <IconCheckCircle2 className="w-3 h-3" />
                            Verified Meta URL
                          </span>
                        </div>
                        <h3 className="text-sm font-bold text-white">{link.title}</h3>
                        <p className="text-xs text-zinc-400 mt-1 leading-relaxed">{link.desc}</p>
                      </div>

                      <div className="mt-4 pt-3 border-t border-white/5">
                        <a
                          href={link.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="w-full py-2 px-3 rounded-xl bg-zinc-800/80 hover:bg-emerald-600/20 text-xs font-semibold text-zinc-200 hover:text-emerald-200 border border-white/5 flex items-center justify-center gap-1.5 transition-all"
                        >
                          <span>Open on Instagram / Meta</span>
                          <IconExternalLink className="w-3.5 h-3.5 text-zinc-400" />
                        </a>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW: GUIDES & KNOWLEDGE BASE */}
            {activeTab === 'guides' && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10 space-y-8">
                <div className="text-center max-w-2xl mx-auto">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-300 text-xs font-semibold mb-2">
                    <IconBookOpen className="w-3.5 h-3.5" />
                    <span>Objective Platform Knowledge</span>
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white">Restriction Knowledge Base</h2>
                  <p className="text-zinc-400 text-sm mt-1">
                    Factual explanations avoiding speculation or claims of undocumented bypasses.
                  </p>
                </div>

                <div className="space-y-4">
                  {GUIDES_DATA.map(g => {
                    const isExpanded = expandedGuide === g.id;
                    return (
                      <div
                        key={g.id}
                        className={`rounded-2xl border transition-all ${
                          isExpanded ? 'bg-zinc-900/90 border-purple-500/40' : 'bg-zinc-900/50 border-white/5'
                        }`}
                      >
                        <button
                          onClick={() => setExpandedGuide(isExpanded ? null : g.id)}
                          className="w-full p-5 text-left flex items-start justify-between gap-4 cursor-pointer"
                        >
                          <div>
                            <div className="flex items-center gap-2 text-[11px] text-zinc-400 mb-1">
                              <span className="px-2 py-0.5 rounded bg-zinc-800 text-zinc-300">{g.category}</span>
                              <span>•</span>
                              <span>{g.readTime}</span>
                            </div>
                            <h3 className="text-base font-bold text-white">{g.title}</h3>
                            <p className="text-xs text-zinc-400 mt-1">{g.summary}</p>
                          </div>
                          <span className="text-zinc-400 text-sm">{isExpanded ? '−' : '+'}</span>
                        </button>

                        {isExpanded && (
                          <div className="p-5 pt-0 border-t border-white/5 text-xs text-zinc-300 leading-relaxed space-y-3">
                            <p className="pt-3 whitespace-pre-line">{g.content}</p>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* VIEW: SCAM SHIELD */}
            {activeTab === 'safety' && (
              <div className="max-w-5xl mx-auto px-4 sm:px-6 py-10 space-y-8">
                <div className="text-center max-w-2xl mx-auto">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-300 text-xs font-semibold mb-2">
                    <IconAlertTriangle className="w-3.5 h-3.5" />
                    <span>Consumer Protection Advisory</span>
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white">Scam Shield & Anti-Fraud Center</h2>
                  <p className="text-zinc-400 text-sm mt-1">
                    How recovery scammers prey on restricted account holders and how to protect yourself.
                  </p>
                </div>

                {/* MANDATORY WARNING HERO */}
                <div className="p-6 sm:p-8 rounded-3xl bg-gradient-to-r from-rose-950 via-zinc-900 to-rose-950 border-2 border-rose-500/40 shadow-2xl">
                  <div className="flex items-start gap-4">
                    <div className="p-3 rounded-2xl bg-rose-500/20 text-rose-400 shrink-0">
                      <IconAlertTriangle className="w-8 h-8" />
                    </div>
                    <div className="space-y-2">
                      <span className="text-xs font-bold uppercase tracking-wider text-rose-400">Non-Negotiable Rule:</span>
                      <blockquote className="text-base sm:text-xl font-bold text-white">
                        "Never give your Instagram password, OTP, 2FA code, session cookie, or recovery code to anyone claiming they can unban your account."
                      </blockquote>
                      <p className="text-xs text-rose-200/80">
                        Websites or individuals claiming they can instantly remove Instagram device or IP bans are scams.
                      </p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  {[
                    {
                      title: 'Telegram & WhatsApp "Recovery Hackers"',
                      claim: '"DM @expert_recovery on Telegram to get your account back in 10 minutes."',
                      fact: 'These are advance-fee fraud syndicates. They demand $50-$500 in crypto or gift cards, then block you or extort you for more.',
                      flags: ['Crypto/gift cards required', 'Redirects to Telegram', 'Guarantees 100% instant unban']
                    },
                    {
                      title: 'Fake "Meta Employee / Inside Support"',
                      claim: '"I have a contact inside Meta headquarters who can flip your account switch."',
                      fact: 'Meta audits internal moderation actions with multi-level authorization. Anyone claiming to sell internal overrides is an impersonator.',
                      flags: ['Claims insider friends at Meta', 'Photoshopped support screenshots', 'Non-Meta email addresses']
                    },
                    {
                      title: '"Ban Bypass Tools" & Modded APKs',
                      claim: '"Download this tool to crack Instagram device bans and bypass rate limits."',
                      fact: 'These files are malicious spyware and session stealers engineered to compromise your computer or phone.',
                      flags: ['Asks to disable antivirus', 'Requests session cookies', 'Unsigned APK or executable files']
                    }
                  ].map((scam, idx) => (
                    <div key={idx} className="p-5 rounded-2xl bg-zinc-900/60 border border-white/10 space-y-3">
                      <h3 className="text-sm font-bold text-white">{scam.title}</h3>
                      <div className="p-2.5 rounded-xl bg-zinc-950 text-xs">
                        <span className="text-zinc-500 block text-[10px] font-bold">THE CLAIM:</span>
                        <p className="text-rose-300 italic">{scam.claim}</p>
                      </div>
                      <p className="text-xs text-zinc-400 leading-relaxed">{scam.fact}</p>
                      <div className="pt-2 border-t border-white/5">
                        <span className="text-[10px] font-bold text-zinc-300 uppercase block mb-1">Red Flags:</span>
                        <ul className="space-y-1">
                          {scam.flags.map((f, i) => (
                            <li key={i} className="text-[11px] text-zinc-400 flex items-center gap-1.5">
                              <span className="text-rose-400">•</span>
                              <span>{f}</span>
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* VIEW: RECOVERY CHECKLIST & DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="max-w-4xl mx-auto px-4 sm:px-6 py-10 space-y-8">
                <div className="text-center max-w-2xl mx-auto">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-500/10 border border-purple-500/20 text-purple-300 text-xs font-semibold mb-2">
                    <IconCheckSquare className="w-3.5 h-3.5" />
                    <span>Recovery Milestones</span>
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-bold text-white">Recovery & Security Checklist</h2>
                  <p className="text-zinc-400 text-sm mt-1">
                    Track your step-by-step progress through problem identification, appeal submission, and security hardening.
                  </p>
                </div>

                {/* Progress bar */}
                <div className="p-6 rounded-3xl bg-zinc-900/80 border border-white/10 space-y-4">
                  <div className="flex items-center justify-between text-xs">
                    <span className="font-bold text-white">Completed: {completedChecks.length} of {CHECKLIST_ITEMS_DATA.length} Tasks</span>
                    <span className="text-purple-300 font-semibold">{Math.round((completedChecks.length / CHECKLIST_ITEMS_DATA.length) * 100)}%</span>
                  </div>
                  <div className="w-full h-2 bg-zinc-950 rounded-full overflow-hidden">
                    <div 
                      className="h-full bg-gradient-to-r from-purple-500 via-pink-500 to-emerald-400 transition-all duration-300"
                      style={{ width: `${(completedChecks.length / CHECKLIST_ITEMS_DATA.length) * 100}%` }}
                    />
                  </div>
                  <div className="text-xs text-zinc-400 flex items-center justify-between pt-1">
                    <span>Workflow: Situation → Details → Recovery Path → Appeal → Checklist</span>
                    <button
                      onClick={handleResetAllData}
                      className="text-rose-400 hover:text-rose-300 text-xs flex items-center gap-1 cursor-pointer"
                    >
                      <IconTrash2 className="w-3.5 h-3.5" />
                      <span>Reset Checklist</span>
                    </button>
                  </div>
                </div>

                {/* Checklist items */}
                <div className="space-y-3">
                  {CHECKLIST_ITEMS_DATA.map(item => {
                    const isDone = completedChecks.includes(item.id);
                    return (
                      <div
                        key={item.id}
                        onClick={() => toggleCheck(item.id)}
                        className={`p-4 rounded-2xl border text-left flex items-start gap-3.5 transition-all cursor-pointer ${
                          isDone
                            ? 'bg-zinc-950/40 border-emerald-500/20 text-zinc-500'
                            : 'bg-zinc-900/60 border-white/10 hover:border-purple-500/30'
                        }`}
                      >
                        <div className="mt-0.5 shrink-0">
                          {isDone ? (
                            <IconCheckCircle2 className="w-5 h-5 text-emerald-400" />
                          ) : (
                            <div className="w-5 h-5 rounded border border-zinc-600" />
                          )}
                        </div>
                        <div className="space-y-0.5">
                          <div className="flex items-center gap-2">
                            <h4 className={`text-xs font-semibold ${isDone ? 'line-through text-zinc-500' : 'text-white'}`}>
                              {item.title}
                            </h4>
                            {item.important && (
                              <span className="text-[10px] font-bold px-1.5 py-0.2 rounded bg-amber-500/10 text-amber-300 border border-amber-500/20">
                                Crucial
                              </span>
                            )}
                          </div>
                          <p className={`text-xs leading-relaxed ${isDone ? 'text-zinc-600' : 'text-zinc-400'}`}>
                            {item.desc}
                          </p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* 4. FOOTER */}
          <footer className="bg-zinc-950 border-t border-white/10 text-zinc-400 text-xs py-12 px-4 sm:px-6 lg:px-8 mt-16">
            <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
              <div className="md:col-span-2 space-y-3">
                <div className="flex items-center gap-2">
                  <div className="w-6 h-6 rounded-lg bg-gradient-to-tr from-purple-600 to-rose-500 flex items-center justify-center p-0.5">
                    <div className="w-full h-full bg-zinc-950 rounded-[6px] flex items-center justify-center">
                      <IconShield className="w-3.5 h-3.5 text-purple-400" />
                    </div>
                  </div>
                  <span className="text-white font-bold text-base">Insta<span className="text-purple-400">Recover</span></span>
                </div>
                <p className="text-zinc-400 text-xs leading-relaxed max-w-md">
                  Independent educational and recovery guidance tool. Helps users navigate official Instagram and Meta appeal workflows. No credentials collected, no automated bypass tools.
                </p>
                <div className="inline-flex items-center gap-2 px-2.5 py-1 rounded bg-zinc-900 border border-white/10 text-[11px] text-zinc-300">
                  <IconLock className="w-3.5 h-3.5 text-emerald-400" />
                  <span>100% Client-Side Privacy. Zero passwords or tokens requested.</span>
                </div>
              </div>

              <div>
                <h4 className="text-white font-semibold text-xs uppercase tracking-wider mb-3">Official Meta Channels</h4>
                <ul className="space-y-2 text-xs">
                  <li><a href="https://www.instagram.com/hacked" target="_blank" rel="noopener noreferrer" className="hover:text-purple-300">instagram.com/hacked</a></li>
                  <li><a href="https://help.instagram.com/contact/606967319425038" target="_blank" rel="noopener noreferrer" className="hover:text-purple-300">Deactivated Account Form</a></li>
                  <li><a href="https://help.instagram.com/477434105621119" target="_blank" rel="noopener noreferrer" className="hover:text-purple-300">Community Guidelines</a></li>
                  <li><a href="https://help.instagram.com" target="_blank" rel="noopener noreferrer" className="hover:text-purple-300">Instagram Help Center</a></li>
                </ul>
              </div>

              <div>
                <h4 className="text-white font-semibold text-xs uppercase tracking-wider mb-3">Privacy & Controls</h4>
                <p className="text-zinc-500 text-xs mb-3">
                  All questionnaire answers and checklists are saved only in your local browser cache.
                </p>
                <button
                  onClick={handleResetAllData}
                  className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-zinc-900 hover:bg-rose-950/40 text-zinc-300 hover:text-rose-300 border border-white/10 text-xs cursor-pointer"
                >
                  <IconTrash2 className="w-3.5 h-3.5" />
                  <span>Clear All Session Data</span>
                </button>
              </div>
            </div>

            {/* Required Specific Footer */}
            <div className="max-w-7xl mx-auto pt-8 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left">
              <p className="text-zinc-500 text-[11px]">
                Independent recovery guidance tool. <strong className="text-zinc-400">Not affiliated with Instagram or Meta.</strong>
              </p>
              <span className="text-[11px] text-zinc-500">
                Safe, legitimate recovery assistance
              </span>
            </div>
          </footer>
        </div>
      );
    }

    // Render Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<InstaRecoverApp />);
  </script>
</body>
</html>
