<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040807">
<title>PricePulse AI</title>
<meta name="description" content="Compare Indian store prices, see real price history, get alerts.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#040807;--panel:#0a1311;--line:#18291f;--em:#10b981;--mint:#6ee7b7;--muted:#86a096;--warn:#e0a43a;--text:#e8f3ee;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font:16px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(4.5rem + env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px)}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
main{max-width:46rem;margin:0 auto;padding:1.5rem 1rem}
.muted{color:var(--muted)}.mint{color:var(--mint)}.warn{color:var(--warn)}.small{font-size:.875rem}.xs{font-size:.75rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pad{padding:1rem}
.stack>*+*{margin-top:2rem}.stack-sm>*+*{margin-top:.5rem}.stack-md>*+*{margin-top:.75rem}
.list{list-style:none;margin:0;padding:0}.list>li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.row-link{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:1rem}
.trunc{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{min-width:0;flex:1}
input,select,button{font:inherit;color:inherit}
input[type=search],select{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.75rem 1rem;width:100%;outline:none}
input[type=search]:focus,select:focus{border-color:var(--em)}
select{border-radius:8px;padding:.5rem .75rem}
.btn{background:var(--em);color:var(--ink);font-weight:600;border:0;border-radius:12px;padding:.75rem 1.25rem;cursor:pointer}
.btn-o{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:.5rem 1rem;cursor:pointer}
.btn-o:disabled{opacity:.4;cursor:default}
.chip{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:.375rem .75rem;cursor:pointer;font-size:.875rem;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--em);color:var(--ink);border-color:var(--em)}
.chips{display:flex;gap:.25rem;overflow-x:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.stat{padding:.75rem}.stat dt{font-size:.75rem;color:var(--muted)}.stat dd{margin:0;font-weight:600}
.best{border-color:var(--em)}
.price{font-size:1.125rem;font-weight:600;color:var(--mint)}
h1{font-size:2.25rem;line-height:1.15}h2{font-size:1.25rem}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav a{flex:1;text-align:center;padding:1rem 0;font-size:.875rem;font-weight:500;color:var(--muted)}
.nav a[aria-current=page]{color:var(--mint)}
.brand{display:none}
@media(min-width:768px){
 body{padding-bottom:0;padding-left:15rem}
 .nav{top:0;bottom:auto;right:auto;width:15rem;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:1rem;gap:.25rem}
 .nav a{text-align:left;padding:.5rem .75rem;border-radius:8px}
 .nav a[aria-current=page]{background:rgba(16,185,129,.15)}
 .brand{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.25rem;color:var(--mint);margin-bottom:1.5rem}
}
svg.chart{width:100%;display:block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="nav" id="nav" aria-label="Main">
  <span class="brand">PricePulse AI</span>
  <a href="#/" data-r="home">Home</a>
  <a href="#/search" data-r="search">Search</a>
</nav>
<main id="app"><p class="muted">Loading…</p></main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
/* ====== CONFIG: paste your PUBLIC values only. NEVER the service_role key. ====== */
const SUPABASE_URL = "https://haeocfmatrwihvwkawap.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_WX01KDUeC8fU65e9ZvuGzQ_BoPVNtu_";
/* ================================================================================ */

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => (/^https?:\/\//i.test(u || "") ? u : "#");
const inr = p => p == null ? "Not available" : new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", maximumFractionDigits: p % 100 === 0 ? 0 : 2 }).format(p / 100);
const ago = iso => {
  if (!iso) return "never verified";
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
};
const STATUS = { verified: "Verified", stale: "Stale", unavailable: "Unavailable" };
const configured = !SUPABASE_URL.startsWith("PASTE") && !SUPABASE_ANON_KEY.startsWith("PASTE");
const db = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } }) : null;

let navToken = 0; // drops results of outdated navigations

function setNav(name) {
  document.querySelectorAll("#nav a").forEach(a => {
    if (a.dataset.r === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
}

async function route() {
  const token = ++navToken;
  const h = location.hash.slice(1) || "/";
  const [path, qs] = h.split("?");
  window.scrollTo(0, 0);
  if (!configured) {
    app.innerHTML = '<div class="card pad stack-sm"><h2>Setup needed</h2><p class="muted">Open index.html, and paste your Supabase project URL and anon key into the CONFIG block near the top of the script.</p></div>';
    return;
  }
  try {
    if (path.startsWith("/product/")) { setNav(""); await renderProduct(decodeURIComponent(path.slice(9)), token); }
    else if (path === "/search") { setNav("search"); renderSearch(new URLSearchParams(qs || "").get("q") || "", token); }
    else { setNav("home"); await renderHome(token); }
  } catch (e) {
    if (token === navToken) app.innerHTML = '<p class="warn">Something went wrong: ' + esc(e.message) + "</p>";
  }
}

async function renderHome(token) {
  const [stores, offers, prods] = await Promise.all([
    db.from("stores").select("id,name,is_active,last_success_at").order("name"),
    db.from("offers_effective").select("id,product_id,listing_title,store_name,effective_paise,last_verified_at").eq("price_status", "verified").order("last_verified_at", { ascending: false }).limit(8),
    db.from("products").select("id", { count: "exact", head: true }).eq("is_active", true)
  ]);
  if (token !== navToken) return;
  const offersHtml = offers.error ? '<p class="warn">Could not load prices: ' + esc(offers.error.message) + "</p>"
    : offers.data.length ? '<ul class="list card">' + offers.data.map(o =>
      '<li><a class="row-link" href="#/product/' + esc(o.product_id) + '"><span class="grow"><span class="trunc">' + esc(o.listing_title) + '</span><span class="muted small">' + esc(o.store_name) + " · checked " + ago(o.last_verified_at) + '</span></span><span class="price">' + inr(o.effective_paise) + "</span></a></li>").join("") + "</ul>"
    : '<p class="card pad muted">No verified prices yet. Prices appear here once a store integration is connected and a check succeeds.</p>';
  const storesHtml = stores.error ? '<p class="warn">Could not load stores: ' + esc(stores.error.message) + "</p>"
    : '<ul class="list grid2" style="border:0">' + stores.data.map(s =>
      '<li class="card pad" style="border-top:1px solid var(--line)"><div>' + esc(s.name) + '</div><div class="small ' + (s.is_active ? "mint" : "muted") + '">' + (s.is_active ? "Connected · last success " + ago(s.last_success_at) : "Not connected") + "</div></li>").join("") + "</ul>";
  app.innerHTML = '<div class="stack"><section><h1>Know the real price before you buy.</h1><p class="muted" style="margin:.5rem 0 0">Prices come only from connected, permitted sources. Every price shows when it was last verified.</p>' +
    '<form id="hf" class="row" style="margin-top:1.25rem"><input name="q" type="search" placeholder="Search a product, brand or model" aria-label="Search products"><button class="btn">Search</button></form>' +
    '<p class="muted small" style="margin:.5rem 0 0">' + (prods.count ?? 0) + " products tracked</p></section>" +
    '<section class="stack-md"><h2>Recently verified prices</h2>' + offersHtml + "</section>" +
    '<section class="stack-md"><h2>Store connections</h2>' + storesHtml + "</section></div>";
  document.getElementById("hf").addEventListener("submit", e => {
    e.preventDefault();
    location.hash = "#/search?q=" + encodeURIComponent(new FormData(e.target).get("q") || "");
  });
}

function renderSearch(initialQ, token) {
  const PAGE = 20;
  let q = initialQ, page = 0, sort = "recent", rows = [], loading = false, err = null, seq = 0, timer;
  app.innerHTML = '<div class="stack-md"><input id="q" type="search" placeholder="Product, brand or model" aria-label="Search products" autofocus>' +
    '<label class="muted small row" style="justify-content:flex-start">Sort (this page) <select id="s"><option value="recent">Recently updated</option><option value="price">Lowest verified price</option></select></label>' +
    '<div id="out"></div><div class="row"><button id="prev" class="btn-o">Previous</button><button id="next" class="btn-o">Next</button></div></div>';
  const $q = document.getElementById("q"), $s = document.getElementById("s"), $out = document.getElementById("out");
  const $prev = document.getElementById("prev"), $next = document.getElementById("next");
  $q.value = q;
  function draw() {
    $prev.disabled = page === 0 || loading; $next.disabled = rows.length < PAGE || loading;
    if (err) { $out.innerHTML = '<p class="warn">Search failed: ' + esc(err) + "</p>"; return; }
    if (loading && !rows.length) { $out.innerHTML = '<p class="muted">Searching…</p>'; return; }
    if (!rows.length) { $out.innerHTML = '<p class="card pad muted">No products found' + (q ? " for “" + esc(q) + "”" : "") + ".</p>"; return; }
    const shown = sort === "price" ? [...rows].sort((a, b) => (a.lowest_effective_paise ?? Infinity) - (b.lowest_effective_paise ?? Infinity)) : rows;
    $out.innerHTML = '<ul class="list card">' + shown.map(r =>
      '<li><a class="row-link" href="#/product/' + esc(r.id) + '"><span class="grow"><span class="trunc">' + esc(r.title) + '</span><span class="muted small">' + esc(r.brand || "—") + " · " + r.offer_count + " listing" + (r.offer_count == 1 ? "" : "s") + '</span></span><span class="price">' + (r.lowest_effective_paise == null ? '<span class="muted small">No verified price</span>' : inr(r.lowest_effective_paise)) + "</span></a></li>").join("") + "</ul>";
  }
  async function load() {
    const my = ++seq; loading = true; err = null; draw();
    const { data, error } = await db.rpc("search_products", { q, lim: PAGE, skip_n: page * PAGE });
    if (my !== seq || token !== navToken) return;
    loading = false; if (error) err = error.message; else rows = data || []; draw();
  }
  $q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { q = $q.value; page = 0; load(); }, 350); });
  $s.addEventListener("change", () => { sort = $s.value; draw(); });
  $prev.addEventListener("click", () => { page--; load(); });
  $next.addEventListener("click", () => { page++; load(); });
  load();
}

async function renderProduct(id, token) {
  const { data: p, error: pe } = await db.from("products").select("id,title,brand,model_number").eq("id", id).eq("is_active", true).maybeSingle();
  if (token !== navToken) return;
  if (pe) throw pe;
  if (!p) { app.innerHTML = '<p class="card pad muted">Product not found. <a class="mint" href="#/search">Back to search</a></p>'; return; }
  const [vr, or] = await Promise.all([
    db.from("product_variants").select("id,variant_label").eq("product_id", id),
    db.from("offers_effective").select("*").eq("product_id", id)
  ]);
  if (or.error) throw or.error;
  const variants = vr.data || [], offers = or.data || [], ids = offers.map(o => o.id);
  let points = [];
  if (ids.length) {
    const since = new Date(Date.now() - 365 * 864e5).toISOString();
    const r = await db.from("price_history").select("offer_id,price_paise,observed_at").in("offer_id", ids).gte("observed_at", since).order("observed_at", { ascending: true }).limit(5000);
    if (r.error) throw r.error; points = r.data || [];
  }
  if (token !== navToken) return;
  // Variants are never mixed: each variant is its own comparison group with its own lowest offer.
  const groups = new Map();
  offers.forEach(o => { const k = o.variant_id || "none"; groups.set(k, [...(groups.get(k) || []), o]); });
  const label = k => k === "none" ? "Variant not specified" : (variants.find(v => v.id === k) || {}).variant_label || "Variant";
  let html = '<div class="stack"><header><h1 style="font-size:1.875rem">' + esc(p.title) + '</h1><p class="muted" style="margin:0">' + esc([p.brand, p.model_number].filter(Boolean).join(" · ")) + "</p></header>";
  if (!offers.length) html += '<p class="card pad muted">No store listings for this product yet.</p>';
  groups.forEach((os, k) => {
    const ok = os.filter(o => o.price_status === "verified" && o.effective_paise != null);
    const best = ok.length ? Math.min(...ok.map(o => o.effective_paise)) : null;
    html += '<section class="stack-sm"><h2 style="font-size:1.125rem">' + esc(label(k)) + "</h2>" + os.map(o => {
      const isBest = best != null && o.price_status === "verified" && o.effective_paise === best;
      const disc = o.mrp_paise && o.price_paise ? '<div class="muted xs"><s>' + inr(o.mrp_paise) + "</s> · " + Math.round((1 - o.price_paise / o.mrp_paise) * 100) + "% off</div>" : "";
      return '<article class="card pad' + (isBest ? " best" : "") + '"><div class="row" style="align-items:flex-start"><div><div style="font-weight:500">' + esc(o.store_name) + '</div><div class="muted small">' + STATUS[o.price_status] + " · checked " + ago(o.last_verified_at) + " · " + esc(String(o.source_type).replace("_", " ")) + '</div></div><div style="text-align:right"><div class="price">' + inr(o.price_paise) + "</div>" + disc + "</div></div>" +
        '<p class="muted small" style="margin:.25rem 0 0">' + (o.shipping_known ? "Shipping " + inr(o.shipping_paise) + " · total " + inr(o.effective_paise) : "Shipping not known; total may be higher") + " · " + esc(String(o.availability).replace("_", " ")) + "</p>" +
        (isBest ? '<p class="mint small" style="margin:.25rem 0 0;font-weight:600">Lowest verified price for this variant</p>' : "") +
        '<a class="mint small" style="text-decoration:underline;display:inline-block;margin-top:.5rem" href="' + esc(safeUrl(o.product_url)) + '" target="_blank" rel="noopener noreferrer nofollow">View on ' + esc(o.store_name) + "</a></article>";
    }).join("") + "</section>";
  });
  if (offers.length) html += '<section id="hist" class="stack-md"></section>';
  html += '<p class="muted xs">Forecasts and buy recommendations arrive in a later phase and will show tested accuracy only.</p></div>';
  app.innerHTML = html;
  if (offers.length) initHistory(offers.map(o => ({ id: o.id, label: label(o.variant_id || "none") + " · " + o.store_name })), points);
}

function initHistory(offerOpts, points) {
  const RANGES = [["24h", 1], ["7d", 7], ["30d", 30], ["90d", 90], ["180d", 180], ["365d", 365]];
  let offerId = offerOpts[0].id, days = 30;
  const el = document.getElementById("hist");
  el.innerHTML = "<h2>Price history</h2>" +
    '<select id="ho">' + offerOpts.map(o => '<option value="' + esc(o.id) + '">' + esc(o.label) + "</option>").join("") + "</select>" +
    '<div class="chips" id="hr">' + RANGES.map(([l, n]) => '<button class="chip" data-d="' + n + '">' + l + "</button>").join("") + "</div>" +
    '<div id="hb"></div><p class="muted xs">Only prices actually recorded by checks are shown. The average is across observations, not time-weighted.</p>';
  const body = document.getElementById("hb");
  function draw() {
    document.querySelectorAll("#hr .chip").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.d === days)));
    const since = Date.now() - days * 864e5;
    const s = points.filter(p => p.offer_id === offerId && new Date(p.observed_at).getTime() >= since).sort((a, b) => new Date(a.observed_at) - new Date(b.observed_at));
    const v = s.map(p => p.price_paise), last = v[v.length - 1], first = v[0];
    const min = v.length ? Math.min(...v) : null, max = v.length ? Math.max(...v) : null;
    const avg = v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null;
    const change = v.length > 1 && first ? ((last - first) / first) * 100 : null;
    let chart;
    if (s.length < 2) chart = '<p class="card pad muted">Not enough recorded observations in this period to draw a chart.' + (s.length === 1 ? " One observation: " + inr(last) + "." : "") + "</p>";
    else {
      const W = 600, H = 180, t0 = new Date(s[0].observed_at).getTime(), t1 = new Date(s[s.length - 1].observed_at).getTime();
      const x = p => t1 === t0 ? W / 2 : ((new Date(p.observed_at).getTime() - t0) / (t1 - t0)) * (W - 20) + 10;
      const y = n => max === min ? H / 2 : H - 15 - ((n - min) / (max - min)) * (H - 30);
      let d = ""; s.forEach((p, i) => { d += i ? " H" + x(p).toFixed(1) + " V" + y(p.price_paise).toFixed(1) : "M" + x(p).toFixed(1) + " " + y(p.price_paise).toFixed(1); });
      chart = '<svg class="chart card" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Observed price history"><path d="' + d + '" fill="none" stroke="#10b981" stroke-width="2.5"/></svg>';
    }
    const stats = [["Current", inr(last)], ["Previous", inr(v[v.length - 2])], ["Lowest", inr(min)], ["Highest", inr(max)], ["Average", inr(avg)], ["Change", change == null ? "—" : change.toFixed(1) + "%"]];
    body.innerHTML = '<div class="stack-md">' + chart + '<dl class="grid3" style="margin:0">' + stats.map(([k, val]) => '<div class="card stat"><dt>' + k + "</dt><dd>" + esc(val) + "</dd></div>").join("") + "</dl></div>";
  }
  document.getElementById("ho").addEventListener("change", e => { offerId = e.target.value; draw(); });
  document.getElementById("hr").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) { days = +b.dataset.d; draw(); } });
  draw();
}

window.addEventListener("hashchange", route);
route();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
