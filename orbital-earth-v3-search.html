<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030711"><title>Orbital Earth · Explore</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;color:#edf5ff;font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}#globe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}.top{position:fixed;z-index:2;top:14px;left:14px;right:14px;max-width:760px;margin:auto}.brand{font-size:11px;letter-spacing:.2em;font-weight:800;margin:0 0 12px 3px;text-shadow:0 2px 8px #000}.search{display:flex;gap:7px;padding:7px;border:1px solid #9bb9e544;border-radius:16px;background:#061020cc;backdrop-filter:blur(15px)}input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;padding:10px;font:inherit;font-size:16px}button{border:1px solid #8bbfff44;background:#0c1a30;color:#eaf4ff;border-radius:11px;padding:10px 13px;min-height:44px;font:inherit;cursor:pointer}.go{background:#c8efff;color:#071323;font-weight:750}.results{display:none;max-height:35vh;overflow:auto;background:#071020f5;border:1px solid #9bb9e544;border-radius:13px;margin-top:6px}.result{display:block;width:100%;height:auto;text-align:left;border:0;border-bottom:1px solid #ffffff12;border-radius:0;background:transparent;white-space:normal}.result small{display:block;color:#91a3c2;margin-top:3px}.tools{position:fixed;right:14px;top:50%;transform:translateY(-50%);display:grid;gap:8px;z-index:2}.tools button{width:48px;height:48px;padding:0;border-radius:50%;font-size:22px;background:#071020d9;backdrop-filter:blur(10px)}.bottom{position:fixed;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:end;gap:8px;pointer-events:none}.chip{font-size:11px;color:#d6e6ff;background:#061020c9;border:1px solid #9bb9e533;border-radius:12px;padding:10px 12px;backdrop-filter:blur(12px);max-width:70%;line-height:1.45}.chip b{color:#fff}.bottom button{pointer-events:auto}.status{font-size:10px;color:#91a3c2;margin:7px 5px 0;text-shadow:0 2px 8px #000}@media(min-width:700px){.top{top:22px}.bottom{bottom:22px;left:22px;right:22px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<canvas id="globe" aria-label="Interactive Earth globe. Drag to rotate and pinch or use plus and minus to zoom."></canvas>
<div class="top"><div class="brand">◉ ORBITAL / EARTH</div><form class="search" id="form"><input id="q" type="search" autocomplete="off" placeholder="Search a country, city or place…" aria-label="Search a country, city or place"><button class="go" type="submit">Search</button></form><div id="results" class="results" role="listbox"></div><div class="status" id="status">Interactive globe · search worldwide places</div></div>
<div class="tools"><button id="plus" aria-label="Zoom in">+</button><button id="minus" aria-label="Zoom out">−</button><button id="pause" aria-label="Pause rotation">Ⅱ</button><button id="reset" aria-label="Reset view">↺</button></div>
<div class="bottom"><div class="chip"><b id="place">Earth</b><br><span id="clock">Calculating UTC…</span><br><span id="sun">Solar position loading…</span></div><div class="chip">☼ Day / night · 🌃 City lights<br><span style="color:#91a3c2">Drag to rotate · Pinch to zoom</span></div></div>
<script type="module">
const $=id=>document.getElementById(id),canvas=$('globe');let THREE,renderer,scene,camera,earth,mat,zoom=3.7,paused=false,drag=false,down=false,lastX=0,lastY=0,lastPinch=0,points=new Map(),clouds;let vel=0;
function solar(d){let jd=d.getTime()/86400000+2440587.5,n=jd-2451545,L=(280.460+.9856474*n)%360,g=(357.528+.9856003*n)*Math.PI/180,lam=(L+1.915*Math.sin(g)+.020*Math.sin(2*g))*Math.PI/180,eps=(23.439-.0000004*n)*Math.PI/180,ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)),dec=Math.asin(Math.sin(eps)*Math.sin(lam)),gmst=((280.46061837+360.98564736629*(jd-2451545))%360+360)%360*Math.PI/180,lon=((ra-gmst)*180/Math.PI+540)%360-180;return{lat:dec*180/Math.PI,lon}}
function clock(){let d=new Date(),s=solar(d);$('clock').textContent=d.toISOString().slice(11,19)+' UTC · '+d.toISOString().slice(0,10);$('sun').textContent='Sun point '+Math.abs(s.lat).toFixed(1)+'°'+(s.lat<0?'S':'N')+' / '+Math.abs(s.lon).toFixed(1)+'°'+(s.lon<0?'W':'E')}
setInterval(clock,1000);clock();
async function init(){try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.165.0/+esm');renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;scene=new THREE.Scene();scene.background=new THREE.Color('#030711');camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.z=zoom;scene.add(new THREE.AmbientLight(0xffffff,.12));const loader=new THREE.TextureLoader(),base='https://threejs.org/examples/textures/planets/';const load=async(u,c=false)=>{let t=await loader.loadAsync(base+u);if(c)t.colorSpace=THREE.SRGBColorSpace;return t};let [day,night]=await Promise.all([load('earth_atmos_2048.jpg',true),load('earth_lights_2048.png',true)]);mat=new THREE.ShaderMaterial({uniforms:{dayMap:{value:day},nightMap:{value:night},sunDir:{value:new THREE.Vector3(1,0,0)}},vertexShader:'varying vec2 vUv;varying vec3 vN;void main(){vUv=uv;vN=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:'uniform sampler2D dayMap;uniform sampler2D nightMap;uniform vec3 sunDir;varying vec2 vUv;varying vec3 vN;void main(){float ndl=dot(normalize(vN),normalize(sunDir));float d=smoothstep(-.12,.18,ndl);vec3 day=texture2D(dayMap,vUv).rgb*(.24+.96*max(ndl,0.));vec3 night=vec3(.004,.009,.022)+texture2D(nightMap,vUv).rgb*vec3(1.,.65,.3)*1.8;gl_FragColor=vec4(mix(night,day,d),1.);}'});earth=new THREE.Mesh(new THREE.SphereGeometry(1,96,96),mat);scene.add(earth);let glow=new THREE.Mesh(new THREE.SphereGeometry(1.035,64,64),new THREE.MeshBasicMaterial({color:0x398dff,transparent:true,opacity:.12,side:THREE.BackSide}));scene.add(glow);$('status').textContent='Globe loaded · place search uses OpenStreetMap';addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});setup();animate()}catch(e){console.error(e);$('status').textContent='Globe could not load. Check internet and refresh.'}}
function setup(){const form=$('form'),input=$('q'),results=$('results');async function search(q){if(!q.trim())return;results.style.display='block';results.innerHTML='<div class="result">Searching worldwide…</div>';try{let r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&q='+encodeURIComponent(q),{headers:{'Accept-Language':'en'}});if(!r.ok)throw Error();let data=await r.json();results.innerHTML='';if(!data.length){results.textContent='No places found. Try another name.';return}for(let item of data){let b=document.createElement('button');b.type='button';b.className='result';let title=item.name||item.display_name.split(',')[0],strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=title;small.textContent=item.display_name;b.append(strong,small);b.onclick=()=>{let lat=+item.lat,lon=+item.lon;$('place').textContent=item.display_name;results.style.display='none';input.value=title;if(earth){earth.rotation.y=-lon*Math.PI/180;earth.rotation.x=lat*Math.PI/180;zoom=item.type==='country'?2.7:1.8;camera.position.z=zoom}};results.append(b)}}catch(e){results.textContent='Search service unavailable. Check internet and try again.'}}form.onsubmit=e=>{e.preventDefault();search(input.value)};let timer;input.oninput=()=>{clearTimeout(timer);if(input.value.trim().length>=3)timer=setTimeout(()=>search(input.value),450);else results.style.display='none'};document.addEventListener('click',e=>{if(!e.target.closest('.top'))results.style.display='none'});
canvas.addEventListener('pointerdown',e=>{points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===1){down=true;drag=true;lastX=e.clientX;lastY=e.clientY}else if(points.size===2){let a=[...points.values()];lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);down=false}canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size>=2){let a=[...points.values()],dist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch){zoom=Math.max(1.25,Math.min(12,zoom+(lastPinch-dist)*.012));camera.position.z=zoom}lastPinch=dist;return}if(down){let dx=e.clientX-lastX,dy=e.clientY-lastY;earth.rotation.y+=dx*.006;earth.rotation.x=Math.max(-1.4,Math.min(1.4,earth.rotation.x+dy*.004));vel=dx*.0004;lastX=e.clientX;lastY=e.clientY}});let stop=e=>{points.delete(e.pointerId);down=false;drag=false;lastPinch=0};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(1.25,Math.min(12,zoom+e.deltaY*.004));camera.position.z=zoom},{passive:false});$('plus').onclick=()=>{zoom=Math.max(1.25,zoom-.6);camera.position.z=zoom};$('minus').onclick=()=>{zoom=Math.min(12,zoom+.6);camera.position.z=zoom};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};$('reset').onclick=()=>{earth.rotation.set(0,0,0);zoom=3.7;camera.position.z=zoom}}
function animate(){requestAnimationFrame(animate);if(!earth)return;let s=solar(new Date()),lon=-s.lon*Math.PI/180,lat=s.lat*Math.PI/180;mat.uniforms.sunDir.value.set(Math.cos(lat)*Math.sin(lon),Math.sin(lat),Math.cos(lat)*Math.cos(lon)).applyAxisAngle(new THREE.Vector3(0,1,0),earth.rotation.y);if(!paused&&!drag){earth.rotation.y+=.00022;earth.rotation.y+=vel;vel*=.97}renderer.render(scene,camera)}
init();
</script></body></html>
